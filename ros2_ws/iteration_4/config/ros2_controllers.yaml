controller_manager:
  ros__parameters:
    update_rate: 120
    
    arm_planning_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_planning_group_controller:
  ros__parameters:
    joints:
      - Joint_1
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    constraint:
      stopped_velocity_tolerance: 0.01
      Joint_1.goal: 0.001
      Joint_1.trajectory: 0.001
    gains:
      Joint_1:
        p: 5.00
        i: 0.0
        d: 0.10
        error_deadband: 0.00
